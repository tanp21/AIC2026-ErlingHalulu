[project]
name = "aic-hcmc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter",
    "ipykernel",
    "tensorflow[and-cuda]",
    "opencv-python-headless",
    "ffmpeg-python",
    "tqdm",
    "transnetv2 @ git+https://github.com/soCzech/TransNetV2.git",
    "open-clip-torch>=3.3.0",
    "pyarrow>=25.0.1",
    "faiss-cpu>=1.9.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30.0",
    "elasticsearch>=9.0.0,<10",
    "sentence-transformers>=5.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27",
    # InternVL-family checkpoints (`5CD-AI/Vintern-1B-v3_5`) import einops from
    # their own remote code, which transformers executes at load time. Not
    # pullable via any other pinned package; the Qwen VLMs do not need it.
    "einops>=0.8.0",
]

# The production image deliberately excludes notebooks, TensorFlow, and the
# keyframe-extraction toolchain.  Docker installs only this locked group.
[dependency-groups]
server = [
    "opencv-python-headless",
    "ffmpeg-python",
    "open-clip-torch>=3.3.0",
    "pyarrow>=25.0.1",
    "faiss-cpu>=1.9.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30.0",
    "elasticsearch>=9.0.0,<10",
    "sentence-transformers>=5.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27",
    "einops>=0.8.0",
]
# The retrieval agent also runs in-process behind /api/agent/*, so the server group
# pins the same packages; this group keeps CLI-only installs (`--group agent`) light.
agent = [
    "google-genai>=1.0.0",
    "httpx>=0.27",
]
