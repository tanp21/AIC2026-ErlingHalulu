global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout http-request 10s
    timeout http-keep-alive 30s
    timeout client 1h
    timeout server 1h

# The laptop ingress, for a team wired together by a switch instead of joined to a tailnet.
#
# Identity is HTTP Basic Auth, exactly as it was before the Tailscale rewrite (commit
# a997816): each teammate gets an account in `haproxy-users.cfg` whose lowercase username
# is one of the five entries in `AIC_ALLOWED_USERS`, and HAProxy stamps that username into
# `X-AIC-User` after deleting any client-supplied copy of the header. The backend is
# unchanged -- it still trusts exactly one header from exactly one proxy.
#
# Why not `haproxy.cfg`: that file trusts `Tailscale-User-Login` and refuses every source
# outside 127.0.0.1/172.16.0.0/12, so a teammate arriving over a switch gets a 403. It also
# falls back to stamping the *admin* identity when a local request carries no Tailscale
# header, which is a trust decision that only makes sense when tailscaled is what puts the
# request on loopback. Neither holds here, so this is a separate file rather than a flag.
#
# The one thing this gives up: the Tailscale config can name a *delegated* user, so the
# compute host can tell the five apart behind the media host. Basic auth has no equivalent
# problem -- each teammate authenticates to this frontend individually, and the media host
# forwards their login on -- so `AIC_CORE_USER` and the compute host's
# `AIC_MEDIA_HOST_LOGIN` carry that job instead. See docs/laptop-media-host.md.
frontend aic_ingress
    bind :8000
    acl health path -i /healthz
    acl authenticated http_auth(aic_users)
    acl admin http_auth_user -i "${AIC_ADMIN_USER}"
    acl video path_beg /video/
    # Drop any client-supplied identity before deciding anything: without this, a teammate
    # could present `X-AIC-User: <the admin>` and be believed.
    http-request del-header X-AIC-User
    # There is no unauthenticated fallback here. `/healthz` is the only anonymous route,
    # matching what `TrustedIngressAccessMiddleware` allows.
    http-request auth realm AIC if !health !authenticated
    http-request set-header X-AIC-User %[http_auth_user] if authenticated
    use_backend teammate_video if video !admin
    default_backend search_app

backend search_app
    server app app:8000 check resolvers docker init-addr last,libc,none

# Teammates share one uplink to the laptop, and `/video/` is the only route that moves
# hundreds of megabytes per request -- one teammate scrubbing a long video must not starve
# the others' thumbnails and searches. The owner is exempt so a stuck download cannot lock
# them out of their own machine's footage.
backend teammate_video
    stick-table type ip size 10k expire 1m store bytes_out_rate(1s)
    filter bwlim-out teammate_video_limit limit 20m key src table teammate_video
    http-response set-bandwidth-limit teammate_video_limit
    server app app:8000 check resolvers docker init-addr last,libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
