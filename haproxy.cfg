global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout http-request 10s
    timeout http-keep-alive 30s
    timeout client 1h
    timeout server 1h

frontend aic_ingress
    bind :8000
    acl health path -i /healthz
    acl authenticated http_auth(aic_users)
    acl admin http_auth_user -i "${AIC_ADMIN_USER}"
    acl video path_beg /video/
    http-request del-header X-AIC-User
    http-request auth realm AIC if !health !authenticated
    http-request set-header X-AIC-User %[http_auth_user] if authenticated
    use_backend teammate_video if video !admin
    default_backend search_app

backend search_app
    server app app:8000 check resolvers docker init-addr last,libc,none

backend teammate_video
    stick-table type integer size 1 expire 1m store bytes_out_rate(1s)
    filter bwlim-out teammate_video_limit limit 24m key int(1) table teammate_video
    http-response set-bandwidth-limit teammate_video_limit
    server app app:8000 check resolvers docker init-addr last,libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
