global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout http-request 10s
    timeout http-keep-alive 30s
    timeout client 1h
    timeout server 1h

frontend aic_ingress
    bind :8000
    acl health path -i /healthz
    # `tailscale serve` terminates the tailnet HTTPS connection on this same host and proxies to
    # us over loopback, adding Tailscale-User-Login for whichever tailnet member is connecting.
    # Only trust that header when it truly arrived over loopback/the docker bridge -- anything
    # else reaching this frontend directly (bypassing tailscaled) is rejected outright.
    acl local_proxy src 127.0.0.1 172.16.0.0/12
    acl has_ts_login req.hdr(Tailscale-User-Login) -m found
    acl is_admin_login req.hdr(Tailscale-User-Login) -i "${AIC_ADMIN_USER}"
    acl video path_beg /video/
    http-request del-header X-AIC-User
    http-request deny deny_status 403 if !health !local_proxy
    http-request set-header X-AIC-User "%[req.hdr(Tailscale-User-Login)]" if local_proxy has_ts_login
    http-request set-header X-AIC-User "${AIC_ADMIN_USER}" if local_proxy !has_ts_login
    use_backend teammate_video if video !is_admin_login
    default_backend search_app

backend search_app
    server app app:8000 check resolvers docker init-addr last,libc,none

backend teammate_video
    stick-table type ip size 10k expire 1m store bytes_out_rate(1s)
    filter bwlim-out teammate_video_limit limit 20m key src table teammate_video
    http-response set-bandwidth-limit teammate_video_limit
    server app app:8000 check resolvers docker init-addr last,libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
