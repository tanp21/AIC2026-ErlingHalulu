global
    log stdout format raw local0
    maxconn 64

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout http-request 10s
    timeout http-keep-alive 30s
    timeout client 1h
    timeout server 1h

frontend tailscale_ingress
    bind :8000
    maxconn 64
    default_backend search_app

backend search_app
    server app app:8000 check resolvers docker init-addr last,libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
