services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - aic-internal
    mem_limit: 4g
    cpus: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &default-logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  app:
    build: .
    env_file:
      - .env.secure
      - path: .env.dres
        required: false
    environment:
      AIC_DATA_DIR: /data
      AIC_TRANSCRIPT_PATH: /data/2026/audio/generated/step_data_clean.parquet
      AIC_INDEX_DIR: /indexes
      AIC_AUDIO_FLAT_PATH: /indexes/audio_v1
      AIC_THUMB_CACHE_DIR: /cache
      AIC_COLLAB_DB: /workspace/aic-collab.sqlite3
      AIC_SHOT_LABEL_DIR: /labels
      AIC_AGENT_OUT_DIR: /workspace/agent
      AIC_VLM_DIR: /models/vlm
      ELASTICSEARCH_URL: http://elasticsearch:9200
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
      TORCH_DISABLE_NATIVE_JIT: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data:/data:ro
      - ./indexes:/indexes:ro
      - ${AIC_HF_HUB_DIR:?Set AIC_HF_HUB_DIR to the host Hugging Face hub directory}:/models/hub:ro
      # Materialised VLM snapshots for AIC_AGENT_VISION=local. Real files, not the
      # blob cache: InternVL's remote code resolves modules relative to __file__.
      - ${AIC_VLM_DIR:?Set AIC_VLM_DIR to the host directory holding the local VLM snapshots}:/models/vlm:ro
      - ./.thumb_cache:/cache
      - collab-data:/workspace
      - type: bind
        source: ./artifacts/shot-labels
        target: /labels
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - aic-internal
      - aic-egress
    user: "${AIC_UID:-1000}:${AIC_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 8
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    logging: *default-logging

  # The venue link to the compute host. It lives inside the docker network, not on the host:
  # a host-side tunnel would have to bind 0.0.0.0 for `app` to reach it, which would put the
  # compute host on the venue LAN, where any client could present any X-AIC-User header.
  # Only needed when AIC_CORE_URL points here (docs/venue-deployment.md); leave it out or
  # down when the app computes locally.
  core-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
      args:
        TUNNEL_UID: ${AIC_UID:-1000}
    environment:
      AIC_CORE_SSH_HOST: ${AIC_CORE_SSH_HOST:?Set AIC_CORE_SSH_HOST to the compute host}
      AIC_CORE_SSH_PORT: ${AIC_CORE_SSH_PORT:-22}
      AIC_CORE_SSH_USER: ${AIC_CORE_SSH_USER:-root}
      AIC_CORE_SSH_KEY: /key/identity
      AIC_TUNNEL_PORT: "9000"
    volumes:
      - ${AIC_CORE_SSH_KEY:?Set AIC_CORE_SSH_KEY to the private key that reaches the compute host}:/key/identity:ro
    tmpfs:
      - /tmp:rw,size=16m,mode=1777
    # Run as the key's owner: the file-sharing layer behind Docker Desktop refuses to let
    # root read a 0600 key it does not own.
    user: "${AIC_UID:-1000}:${AIC_GID:-1000}"
    networks:
      - aic-internal
      - aic-egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    restart: unless-stopped
    logging: *default-logging

  ingress:
    image: haproxy:3.2-alpine
    env_file:
      - .env.secure
    command:
      - haproxy
      - -W
      - -db
      - -f
      - /usr/local/etc/haproxy/haproxy.cfg
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aic-internal
      - aic-ingress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    user: "${AIC_UID:-1000}:${AIC_GID:-1000}"
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

volumes:
  elasticsearch-data:
  collab-data:

networks:
  aic-internal:
    internal: true
  # Server-hosted agent runs call DeepSeek and Gemini; every other service stays internal.
  aic-egress:
  aic-ingress:
