[program:caprl-256-targets]
command=/usr/bin/env CAPRL_MAX_FRAMES=8 CAPRL_MAX_NEW_TOKENS=384 CAPRL_OUTPUT_LABEL=384-no-broadcast-8frames /workspace/aic/scripts/remote/run_caprl_256_targets.sh
directory=/workspace/aic
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
